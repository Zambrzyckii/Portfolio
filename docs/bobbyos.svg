<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" font-family="monospace" role="img" aria-label="BobbyOS 98 SE boot screen">
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000080"/>
      <stop offset="1" stop-color="#1084d0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fff9f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5fff9f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5fff9f" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000" opacity="0.55"/>
    </pattern>
    <clipPath id="screenclip">
      <rect x="20" y="48" width="780" height="236"/>
    </clipPath>
    <style><![CDATA[
      .scr { font-size: 15px; fill: #33ff66; }
      .ok  { fill: #d6ffe2; }
      .dim { fill: #1c8a3e; }
      .line { opacity: 0; animation: appear 0.35s ease-out forwards; }
      .l1 { animation-delay: 0.3s; }
      .l2 { animation-delay: 1.0s; }
      .l3 { animation-delay: 1.6s; }
      .l4 { animation-delay: 2.2s; }
      .l5 { animation-delay: 2.8s; }
      .l6 { animation-delay: 3.6s; }
      .caret { opacity: 0; animation: show 0.1s linear 4.2s forwards, blink 1s step-end 4.2s infinite; }
      .beam { animation: sweep 4.5s linear infinite; }
      .screen { animation: flicker 3s steps(30) infinite; }
      .tcaret { animation: blink 1.1s step-end infinite; }
      @keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes show { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes sweep { from { transform: translateY(-40px); } to { transform: translateY(240px); } }
      @keyframes flicker { 0%,100% { opacity: 1; } 7% { opacity: 0.94; } 9% { opacity: 1; } 52% { opacity: 0.97; } 54% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .line, .caret { opacity: 1; animation: none; }
        .beam, .screen, .tcaret { animation: none; }
      }
    ]]></style>
  </defs>

  <!-- drop shadow -->
  <rect x="16" y="16" width="800" height="280" fill="#000" opacity="0.35"/>

  <!-- window body + Win98 bevel -->
  <rect x="10" y="10" width="800" height="280" fill="#c0c0c0"/>
  <rect x="10" y="10" width="800" height="3" fill="#ffffff"/>
  <rect x="10" y="10" width="3" height="280" fill="#ffffff"/>
  <rect x="10" y="287" width="800" height="3" fill="#000000"/>
  <rect x="807" y="10" width="3" height="280" fill="#000000"/>
  <rect x="13" y="13" width="794" height="3" fill="#dfdfdf"/>

  <!-- title bar -->
  <rect x="15" y="15" width="790" height="26" fill="url(#tb)"/>
  <rect x="19" y="20" width="16" height="16" fill="#000" opacity="0.4"/>
  <rect x="18" y="19" width="16" height="16" fill="#008080"/>
  <rect x="21" y="22" width="10" height="7" fill="#00ff9f"/>
  <text x="42" y="33" font-family="Tahoma, Verdana, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">C:\BOBBYOS\README.EXE</text>

  <!-- title buttons -->
  <g>
    <rect x="742" y="19" width="18" height="18" fill="#c0c0c0" stroke="#000"/>
    <rect x="746" y="32" width="9" height="2" fill="#000"/>
    <rect x="764" y="19" width="18" height="18" fill="#c0c0c0" stroke="#000"/>
    <rect x="768" y="22" width="10" height="9" fill="none" stroke="#000" stroke-width="2"/>
    <rect x="786" y="19" width="18" height="18" fill="#c0c0c0" stroke="#000"/>
    <text x="790" y="33" font-family="Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#000">x</text>
  </g>

  <!-- CRT screen -->
  <rect x="20" y="48" width="780" height="236" fill="#060a06"/>
  <rect x="20" y="48" width="780" height="2" fill="#000"/>
  <rect x="20" y="48" width="2" height="236" fill="#000"/>

  <g clip-path="url(#screenclip)">
    <g class="screen">
      <text x="36" y="80" class="scr" font-size="17" fill="#5fff9f">BobbyOS 98 SE <tspan class="dim">[ Web Edition ]</tspan></text>
      <text x="36" y="112" class="scr line l1">Booting from C:\ <tspan class="dim">..................</tspan> <tspan class="ok">OK</tspan></text>
      <text x="36" y="138" class="scr line l2">&gt; loading DESKTOP.SYS <tspan class="dim">...........</tspan> <tspan class="ok">OK</tspan></text>
      <text x="36" y="164" class="scr line l3">&gt; loading CLIPPY.DLL <tspan class="dim">............</tspan> <tspan class="ok">OK</tspan></text>
      <text x="36" y="190" class="scr line l4">&gt; mounting  \PROJECTS <tspan class="dim">...........</tspan> <tspan class="ok">OK</tspan></text>
      <text x="36" y="216" class="scr line l5">&gt; CRT.OVERLAY <tspan class="dim">....................</tspan> <tspan class="ok">ON</tspan></text>
      <text x="36" y="250" class="scr line l6" font-size="16" fill="#9affc2">a desktop that never got the memo the 2000s happened</text>
      <rect x="470" y="238" width="11" height="16" fill="#9affc2" class="caret"/>
    </g>
    <!-- scanlines -->
    <rect x="20" y="48" width="780" height="236" fill="url(#scan)"/>
    <!-- sweeping beam -->
    <rect x="20" y="48" width="780" height="40" fill="url(#beam)" opacity="0.14" class="beam"/>
  </g>

</svg>
